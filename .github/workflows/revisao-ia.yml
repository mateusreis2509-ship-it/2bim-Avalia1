
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instala Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt
        shell: bash
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Responda em português, em até 10 itens."
            echo "Verifique segredos expostos, SQL concatenado em vez de prepare().bind(),"
            echo "erros de lógica e possíveis vulnerabilidades."
            echo
            echo "Se não encontrar problemas, informe isso claramente."
            echo
            echo '```diff'
            git diff "origin/${{ github.base_ref }}"...HEAD | head -c 20000
            echo '```'
          } > prompt.txt

      - name: Revisa o código com IA
        id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: "Você é um revisor de código objetivo e cuidadoso."
          model: gpt-4.1

      - name: Comenta no pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPOSTA_IA: ${{ steps.ia.outputs.response }}
        shell: bash
        run: |
          if [ -z "$RESPOSTA_IA" ]; then
            echo "::error::A IA não retornou uma resposta."
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --body "$RESPOSTA_IA"
