name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instala Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Testa a IA
        id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt: "Responda em português com uma frase confirmando que o teste funcionou."
          model: gpt-4.1

      - name: Verifica a resposta da IA
        env:
          RESPOSTA_IA: ${{ steps.ia.outputs.response }}
        run: |
          if [ -z "$RESPOSTA_IA" ]; then
            echo "::error::A IA não retornou uma resposta."
            exit 1
          fi

          echo "A IA retornou uma resposta."

      - name: Comenta no pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPOSTA_IA: ${{ steps.ia.outputs.response }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$RESPOSTA_IA"