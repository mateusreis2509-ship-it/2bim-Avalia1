
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Monta o prompt
        shell: bash
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Responda em português, em até 10 itens."
            echo "Procure segredos expostos, SQL inseguro, erros de lógica e vulnerabilidades."
            echo "Se não encontrar problemas, diga isso claramente."
            echo
            echo '```diff'
            git diff "origin/${{ github.base_ref }}"...HEAD | head -c 20000
            echo '```'
          } > prompt.txt

      - name: Revisa o código com IA
        id: ia
        uses: actions/ai-inference@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prompt-file: prompt.txt

      - name: Verifica a resposta
        env:
          RESPOSTA_IA: ${{ steps.ia.outputs.response }}
        run: |
          if [ -z "$RESPOSTA_IA" ]; then
            echo "::error::A IA não retornou uma resposta."
            exit 1
          fi

      - name: Comenta no pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPOSTA_IA: ${{ steps.ia.outputs.response }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$RESPOSTA_IA"
