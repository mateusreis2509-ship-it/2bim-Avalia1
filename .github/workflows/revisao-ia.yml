
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt
        shell: bash
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            git diff "origin/${{ github.base_ref }}"...HEAD | head -c 20000
            echo '```'
          } > prompt.txt

      - name: Revisa o código com IA
        id: ia
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: "Você é um revisor de código objetivo."

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPOSTA: ${{ steps.ia.outputs.response-file }}
        run: |
          if [ -z "$RESPOSTA" ] || [ ! -f "$RESPOSTA" ]; then
            echo "::error::Arquivo de resposta da IA não encontrado."
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body-file "$RESPOSTA"
