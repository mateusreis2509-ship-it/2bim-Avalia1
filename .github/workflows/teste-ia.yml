name: teste-ia

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o repositorio
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Testa a IA
        id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt: "Responda somente com a frase: TESTE FUNCIONOU"
          model: auto

      - name: Valida a resposta
        env:
          RESPOSTA: ${{ steps.ia.outputs.response }}
        shell: bash
        run: |
          echo "Resposta recebida:"
          printf '%s\n' "$RESPOSTA"

          if [[ "$RESPOSTA" != *"TESTE FUNCIONOU"* ]]; then
            echo "::error::A resposta não corresponde ao teste esperado."
            exit 1
          fi

          echo "Teste de IA concluído com sucesso."