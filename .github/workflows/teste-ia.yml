name: teste-ia

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o repositorio
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Testa a IA
        id: ia
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "Responda somente com a frase: TESTE FUNCIONOU" -s --no-ask-user > resposta.txt
          cat resposta.txt

          echo "RESPOSTA<<EOF" >> "$GITHUB_OUTPUT"
          cat resposta.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Valida a resposta
        env:
          RESPOSTA: ${{ steps.ia.outputs.RESPOSTA }}
        shell: bash
        run: |
          echo "Resposta recebida:"
          printf '%s\n' "$RESPOSTA"

          if [[ "$RESPOSTA" != "TESTE FUNCIONOU" ]]; then
            echo "::error::A resposta nao corresponde ao teste esperado."
            exit 1
          fi

          echo "Teste de IA concluido com sucesso."
